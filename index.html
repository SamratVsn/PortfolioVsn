<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <!-- ── Site-wide (route-agnostic) head — never replaced by prerender ── -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons: small raster set generated from the SP mark (the old 900 KB SVG
         favicon was downloaded on every first visit). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E1311" />
    <link rel="sitemap" href="/sitemap.xml" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable site summary" />

    <!-- ── Fonts: self-hosted latin subsets, preloaded before first paint ── -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ── Google Search Console verification ────────────────── -->
    <meta name="google-site-verification" content="google2e0ee218d053ef6b" />

    <!-- ── Site-wide Open Graph / Twitter base ─────────────────── -->
    <meta property="og:site_name" content="Samrat Parajuli" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:site" content="@SamratVsn" />
    <meta name="twitter:creator" content="@SamratVsn" />
    <meta name="author" content="Samrat Parajuli" />

    <!-- ── Site-wide structured data ───────────────────────────────
         Person + WebSite are emitted on every route by seoHead.js, from the
         single identity source in src/content/site.js, and injected inside the
         ROUTE_SEO block below by the prerenderer. Keeping them out of this
         static file avoids a second copy that would drift from the React app. -->

    <!-- ROUTE_SEO_START -->
    <!-- ── Per-route SEO (replaced by prerender for each route) ── -->
    <title>Samrat Parajuli (SamratVsn) — Product-Minded Systems &amp; Application Engineer</title>
    <meta
      name="description"
      content="Portfolio of Samrat Parajuli (SamratVsn), a product-minded systems and application engineer in Kathmandu, Nepal. Native Android in Kotlin and Jetpack Compose, built end to end from product brief to release."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.samratparajuli0.com.np/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.samratparajuli0.com.np/" />
    <meta
      property="og:title"
      content="Samrat Parajuli (SamratVsn) — Product-Minded Systems &amp; Application Engineer"
    />
    <meta
      property="og:description"
      content="Portfolio of Samrat Parajuli (SamratVsn), a product-minded systems and application engineer in Kathmandu, Nepal. Native Android in Kotlin and Jetpack Compose, built end to end from product brief to release."
    />
    <meta
      property="og:image"
      content="https://www.samratparajuli0.com.np/og/og-default.jpg"
    />
    <meta property="og:image:secure_url" content="https://www.samratparajuli0.com.np/og/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Samrat Parajuli (SamratVsn) — Product-Minded Systems &amp; Application Engineer"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.samratparajuli0.com.np/" />
    <meta
      name="twitter:title"
      content="Samrat Parajuli (SamratVsn) — Product-Minded Systems &amp; Application Engineer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Samrat Parajuli (SamratVsn), a product-minded systems and application engineer in Kathmandu, Nepal. Native Android in Kotlin and Jetpack Compose, built end to end from product brief to release."

    <meta
      name="twitter:image"

    <meta name="twitter:image:width" content="1200" />
    <meta name="twitter:image:height" content="630" />
    <meta
      name="twitter:image:alt"
      content="Samrat Parajuli (SamratVsn) — Product-Minded Systems &amp; Application Engineer"
    />

    <meta name="msvalidate.01" content="10C81FC930825CB96F21B1FFF7438979" />

    <!-- Accent seed: applied before first paint so a stored choice never flashes
         the default palette. Served as /theme-init.js rather than inline so the
         CSP's `script-src 'self'` allows it to run in production. -->
    <script src="/theme-init.js"></script>
