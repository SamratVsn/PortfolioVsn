name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and prerender
        run: npm run build

      - name: Route, metadata and link parity
        run: npm run check:dist

      - name: JavaScript budget
        run: npm run check:budget

      - name: Locate Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          if [ -z "$CHROME" ]; then
            echo "No Chrome found on the runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Hydration, CLS and media budget
        run: npm run check:runtime

      - name: Axe (14 routes x desktop/mobile)
        run: npm run check:a11y

      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Upload reports and Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            reports/
            .lighthouseci/
          if-no-files-found: ignore
